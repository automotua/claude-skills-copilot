name: Sync upstream marketplace

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate marketplace.json from upstream
        run: python scripts/sync_marketplace.py

      - name: Validate JSON
        run: python -c "import json;d=json.load(open('.github/plugin/marketplace.json'));assert all(len(p.get('description',''))<=1024 for p in d['plugins']);print(len(d['plugins']),'plugins OK')"

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain .github/plugin/marketplace.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/plugin/marketplace.json
            git commit -m "chore: sync marketplace catalog from upstream"
            git push
          else
            echo "No changes."
          fi
